<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon George Ohm</title>
   <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Simon George Ohm</h1>
        <p>Um físico alemão que contribuiu muito para a eletricidade</p>
    </header>

    <main>
        <img src="ohm.png" alt="Ilustração em estilo pixel art do físico Georg Ohm em um laboratório do século XIX. O cientista, que usa óculos e barba grisalha, aponta para um quadro negro com a inscrição OHM e a fórmula U = R.i. À sua frente, sobre uma mesa de madeira, há equipamentos científicos antigos como pilhas, bobinas e um medidor analógico.">
        <div>
            <h2>Leis de Ohm</h2>
            <p class="artigo-autor">por Luciana</p>
            <p>A ddp é proporcional a corrente elétrica</p>
            <button>😂 <span>0</span></button>
            <button>🤦‍♂️ <span>0</span></button>
        
        </div>
    </main>

</body>

<script>
    const botoes =  document.querySelectorAll("button");

    botoes.forEach (function(botao){
        botao.addEventListener("click", botaoClicado);
        function botaoClicado(){
            console.log("Fui clicado");
            let texto = botao.querySelector("span");
            texto.textContent++;
        }
    })

</script>

</html>
